[project]
name = "datahow-titer-ml"
version = "0.1.0"
description = "Predicting titer values for bioprocessing experiments using machine learning."
readme = "README.md"
authors = [
    { name = "Rangsiman Ketkaew", email = "rangsiman1993@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
]

[project.scripts]
datahow-titer-ml = "datahow_titer_ml:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
